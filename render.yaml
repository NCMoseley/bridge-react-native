services:
  - type: web
    name: tradovate-browser-bridge
    runtime: node
    plan: starter
    buildCommand: npm ci && cd client && npm ci && npm run build && cd .. && npm run build && npm run package:extension
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: bridge-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: DATABASE_PATH
        value: /var/data/bridge.sqlite
      - key: ADMIN_API_KEY
        generateValue: true
      - key: CREDENTIAL_ENCRYPTION_KEY
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: PROXY_WEBHOOK_SECRET
        generateValue: true
      - key: PROXY_ASYNC
        value: '1'
      - key: PUBLIC_BASE_URL
        value: 'https://tradovate-browser-bridge.onrender.com'
      - key: INITIAL_USER_PASSWORD
        value: 'Hardpass123!@#'
      - key: ADMIN_USER_EMAIL
        value: 'ncmoseley@gmail.com'
